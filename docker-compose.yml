services:
  db:
    image: postgres:18
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Note the removal of "/data" at the end of the container path
      - postgres_data:/var/lib/postgresql 
    ports:
      - "5433:5432"

volumes:
  postgres_data:
